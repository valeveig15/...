<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animación: El Brote de Magnolia</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <main class="animation-container">
    
    <canvas id="animCanvas"></canvas>

    <div class="vignette-overlay"></div>
    <div class="grain-overlay"></div>

    <div id="eyeOverlay" class="eye-overlay hidden">
      <div class="eye-socket">
        <div class="iris">
          <div class="pupil"></div>
          <canvas id="irisCanvas" width="200" height="200"></canvas>
        </div>
      </div>
    </div>

    <div id="paintingModal" class="painting-modal hidden">
      <div class="frame">
        <div class="canvas-art">
          <div class="warm-sunlight"></div>
          <div class="magnolia-woman-silhouette"></div>
          <p class="painting-text">"Para mi buen amigo, de mi parte y de la de Magnolia, gracias por todo."</p>
        </div>
      </div>
    </div>

    <section class="story-overlay">
      <div class="narrative-box">
        <p id="storyText">Cargando historia...</p>
      </div>
    </section>

    <footer class="ui-controls">
      <button id="prevBtn" class="control-btn" title="Escena Anterior">❮</button>
      <button id="playPauseBtn" class="control-btn play-btn" title="Reproducir / Pausar">▶</button>
      <button id="nextBtn" class="control-btn" title="Siguiente Escena">❯</button>
      
      <div class="timeline-container">
        <span id="sceneTitle" class="scene-title">Escena 1/6</span>
        <div class="progress-bar-bg">
          <div id="progressBar" class="progress-bar-fill"></div>
        </div>
      </div>

      <button id="interactiveBrushBtn" class="control-btn action-btn hidden">🎨 Pintar</button>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
